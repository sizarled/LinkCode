name: Build Android APK

on:
  push:
    branches: [arena/c5733580-linkcode]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
      - "*.html"
      - "assets/**"
      - "unlock/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships with the Android SDK preinstalled. Locate it and install
      # the platform/build-tools only if they are missing.
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using SDK at: $SDK"
          ls "$SDK" || true
          if [ ! -d "$SDK/platforms/android-35" ] || [ ! -d "$SDK/build-tools/35.0.0" ]; then
            SDKM="$(find "$SDK/cmdline-tools" -path '*bin/sdkmanager' | head -n 1)"
            echo "sdkmanager: $SDKM"
            yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
            "$SDKM" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LinkCode-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
